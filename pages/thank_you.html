<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
        }
        .gradient-text {
            background-image: linear-gradient(45deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <main class="max-w-xl mx-auto text-center">
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 p-8 md:p-12 rounded-2xl shadow-2xl border border-gray-700">
            <div class="mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-500/20 text-blue-400 mb-6">
                    <i class="fas fa-check text-4xl"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">
                    <span class="gradient-text">Thank You!</span>
                </h1>
                <p class="text-lg text-gray-400">
                    Your message has been received. I'll review your details and get back to you within 2 hours to discuss your dispatching needs.
                </p>
            </div>
            
            <div class="border-t border-gray-700 pt-8 mt-8">
                <p class="text-sm text-gray-500 mb-4">In the meantime, feel free to:</p>
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <a href="tel:+15551234567" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-medium py-3 px-6 rounded-lg transition-all">
                        <i class="fas fa-phone-alt mr-2"></i> Call Me
                    </a>
                    <a href="/" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition-all">
                        <i class="fas fa-home mr-2"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
